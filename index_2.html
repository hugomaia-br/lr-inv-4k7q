<script>
(function(){

var params = new URLSearchParams(location.search);
var CHAVE = params.get('chave') || '';
var BASE = 'https://hugomaia.app.n8n.cloud/webhook';
var API = BASE + '/lr-inventario';
var GRAVAR = BASE + '/lr-inventario-gravar';
var SESSAO = params.get('sessao') || ('inv-' + new Date().toISOString().slice(0,10));
var dep = params.get('deposito') || '14888813825';
var COM_LOCAL = { '14888813825':1, '14889165652':1 };
var MAPA_COL = [['A','D',13],['A','E',11],['B','D',1],['B','E',5],['C','D',11],['C','E',13]];
var LOCAL = '';
var itens = [];
var achados = [];
var scanning = false, modoColuna = false, zxReader = null, zxCtl = null, stream = null, laco = 0;
var ultimoCod = '', ultimoT = 0;
var pausado = false, pendente = null;

function el(id){ return document.getElementById(id); }
function camMsg(t, erro){ var c = el('camtxt'); c.textContent = t || ''; c.style.color = erro ? '#f77' : '#8c8'; }
function msg(t, erro){ var m = el('msg'); m.textContent = t || ''; m.style.color = erro ? '#f77' : '#8c8'; if (scanning) { camMsg(t, erro); } }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function num(v){ return (v === null || v === undefined || v !== v) ? '?' : v; }
function vibrar(){ try { if (navigator.vibrate) { navigator.vibrate(60); } } catch(e){} }
function precisaLocal(){ return !!COM_LOCAL[dep]; }
function porque(e){ if (!e) { return 'erro desconhecido'; } return (e.name ? e.name + ': ' : '') + (e.message || String(e)); }

function post(url, dados){
  var corpo = new URLSearchParams();
  corpo.append('chave', CHAVE);
  for (var k in dados) { if (dados[k] !== undefined && dados[k] !== null) { corpo.append(k, dados[k]); } }
  return fetch(url, { method:'POST', body: corpo }).then(function(r){ return r.json(); });
}

// ---------- coluna ----------
function todasColunas(){
  var out = [];
  for (var i = 0; i < MAPA_COL.length; i++) {
    var rua = MAPA_COL[i][0], lado = MAPA_COL[i][1], n = MAPA_COL[i][2];
    for (var k = 1; k <= n; k++) { out.push(rua + ('0' + k).slice(-2) + lado); }
  }
  out.sort();
  return out;
}
function ehColuna(txt){
  var s = String(txt || '').trim().toUpperCase().replace(/^(LR\.|LRCOL:|#)/, '');
  return /^[A-Z]\d{2}[DE]$/.test(s) ? s : '';
}
function colunasUsadas(){
  var vistas = {}, out = [];
  for (var i = 0; i < itens.length; i++) {
    var ls = itens[i].locais || [];
    for (var j = 0; j < ls.length; j++) { if (!vistas[ls[j]]) { vistas[ls[j]] = 1; out.push(ls[j]); } }
  }
  out.sort();
  return out;
}
function montarSelect(){
  var cols = todasColunas();
  var h = '<option value="">escolher a coluna na lista...</option>';
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i];
    h += '<option value="' + c + '">' + c + ' — rua ' + c.charAt(0) + ', lado ' + (c.charAt(3) === 'D' ? 'direito' : 'esquerdo') + ', coluna ' + c.substr(1,2) + '</option>';
  }
  el('colsel').innerHTML = h;
}
function desenharColunas(){
  el('colbar').style.display = precisaLocal() ? 'block' : 'none';
  el('colatual').textContent = LOCAL || '--';
  el('colsel').value = LOCAL || '';
  var cols = colunasUsadas();
  var h = '';
  for (var i = 0; i < cols.length; i++) {
    h += '<button class="ch' + (cols[i] === LOCAL ? ' on' : '') + '" data-col="' + esc(cols[i]) + '">' + esc(cols[i]) + '</button>';
  }
  el('colchips').innerHTML = h;
}
function irParaColuna(v){
  if (!v) { return; }
  LOCAL = v;
  el('camcol').textContent = LOCAL;
  desenharColunas();
  msg('coluna ' + LOCAL + ': pode contar');
}
function marcarLocal(it){
  if (!precisaLocal() || !LOCAL) { return; }
  if (!it.locais) { it.locais = []; }
  if (it.locais.indexOf(LOCAL) < 0) { it.locais.push(LOCAL); it.locais.sort(); }
}

// ---------- lista ----------
function desenhar(){
  var l = el('lista'); l.innerHTML = '';
  var pecas = 0, quantos = 0;
  for (var i = itens.length - 1; i >= 0; i--) {
    var it = itens[i];
    if (it.deposito !== dep) { continue; }
    pecas += it.contado; quantos++;
    var alerta = (it.reserva > 0 && it.contado < it.reserva);
    var d = document.createElement('div');
    d.className = 'item' + (alerta ? ' alerta' : '');
    var h = '<div class=topo><div><div class=cod>' + esc(it.codigo) + '</div><div class=nome>' + esc(it.nome) + '</div></div>';
    h += '<button class=bx data-tira=' + i + '>excluir</button></div><div class=nums>';
    h += '<div class=qtd><button class=bm data-menos=' + i + '>-</button>';
    h += '<input type=number inputmode=numeric data-qtd=' + i + ' value=' + it.contado + '>';
    h += '<button class=bp data-mais=' + i + '>+</button></div>';
    h += '<span class=tag>Bling <b>' + num(it.fisico) + '</b></span>';
    h += '<span class=tag>reserva <b>' + num(it.reserva) + '</b></span>';
    h += '<span class=tag>dif <b>' + (it.contado - (it.fisico || 0)) + '</b></span>';
    if (it.locais && it.locais.length) { h += '<span class=loc>local <b>' + esc(it.locais.join(',')) + '</b></span>'; }
    h += '</div>';
    if (alerta) { h += '<div class=aviso>contado abaixo da reserva: faltou contar ou a reserva esta orfa</div>'; }
    d.innerHTML = h;
    l.appendChild(d);
  }
  el('total').textContent = quantos + ' codigos, ' + pecas + ' pecas';
  el('camtot').textContent = quantos + ' codigos, ' + pecas + ' pecas';
}

function gravarLinha(it){
  post(API, { acao:'contar', sessao:SESSAO, deposito:it.deposito, codigo:it.codigo, idBling:it.idBling,
    nome:it.nome, contado:it.contado, fisico_no_ato:it.fisico, reserva_no_ato:it.reserva,
    local:(it.locais || []).join(','), origem:(it.origem || 'bipagem'), observacao:(it.nota || '') })
  .then(function(r){ if (r && r.ok) { msg('salvo ' + it.codigo + ': ' + it.contado + ((it.locais && it.locais.length) ? ' em ' + it.locais.join(',') : '')); } else { msg('NAO SALVOU ' + it.codigo, true); } })
  .catch(function(){ msg('NAO SALVOU ' + it.codigo + ' no servidor', true); });
}

function removerLinha(i){
  var it = itens[i];
  if (!it) return;
  post(API, { acao:'contar', status:'removido', sessao:SESSAO, deposito:it.deposito, codigo:it.codigo, idBling:it.idBling,
    nome:it.nome, contado:0, fisico_no_ato:it.fisico, reserva_no_ato:it.reserva, local:(it.locais || []).join(','), observacao:'tirado da contagem pelo app' })
  .then(function(){ msg('removido ' + it.codigo); })
  .catch(function(){ msg('NAO CONSEGUI REMOVER ' + it.codigo + '; recarregue a pagina', true); });
  itens.splice(i, 1);
  desenhar(); desenharColunas();
}

function achar(cod){ for (var i=0;i<itens.length;i++){ if (itens[i].codigo===cod && itens[i].deposito===dep) return i; } return -1; }

function somar(dados, quanto, origem, nota){
  origem = origem || 'bipagem';
  var i = achar(dados.codigo);
  if (i >= 0) {
    itens[i].contado += quanto;
    if (origem !== 'bipagem' && itens[i].origem === 'bipagem') { itens[i].origem = origem; itens[i].nota = nota || itens[i].nota; }
    marcarLocal(itens[i]); desenhar(); desenharColunas(); gravarLinha(itens[i]); return;
  }
  var novo = { codigo:dados.codigo, nome:dados.nome, idBling:dados.idBling, deposito:dep, contado:quanto, fisico:dados.fisico, reserva:dados.reserva, locais:[], origem:origem, nota:(nota || '') };
  marcarLocal(novo);
  itens.push(novo);
  desenhar(); desenharColunas(); gravarLinha(novo);
}

function lerQtd(){ var v = parseInt(el('qtd').value, 10); return (isNaN(v) || v <= 0) ? 1 : v; }

function bipar(cod, quanto){
  cod = String(cod||'').trim().toUpperCase();
  if (!cod) return;
  var col = ehColuna(cod);
  if (col) { irParaColuna(col); vibrar(); return; }
  if (precisaLocal() && !LOCAL) { msg('escolha a coluna antes de contar (lista acima ou QR)', true); return; }
  if (quanto === undefined) { quanto = lerQtd(); }
  var i = achar(cod);
  if (i >= 0) { itens[i].contado += quanto; marcarLocal(itens[i]); desenhar(); desenharColunas(); gravarLinha(itens[i]); el('qtd').value=''; vibrar(); msg('+' + quanto + ' em ' + cod + ' (total ' + itens[i].contado + ')'); return; }
  msg('procurando ' + cod + ' no Bling...');
  buscarNoBling(cod, function(res, falha, conexao){
     if (!res) {
       somErro();
       if (conexao) {
         registrarFalha(cod, 'digitado', (falha && falha.erro) || '', true);
         msg('nao consegui falar com o Bling. Esse codigo NAO foi contado: bipa de novo daqui a pouco.', true);
         return;
       }
       registrarFalha(cod, 'digitado', (falha && falha.erro) || '', false);
       procurarSemelhante(cod, 0, function(alvo, semResposta){
         if (alvo) { alvo.via = 'digitado'; pausado = true; mostrarConfirma(alvo); }
         else if (semResposta) { msg('o Bling parou de responder no meio da procura. Bipa de novo daqui a pouco.', true); }
         else { msg('nao achei esse codigo nem nada parecido. Use o botao Procurar.', true); }
       });
       return;
     }
     somar(res, quanto, 'digitado'); el('qtd').value=''; vibrar();
     msg('achei: ' + res.nome + ' (+' + quanto + ')');
   });
}

function desfazer(){
  if (!ultimoCod) { msg('nada para desfazer', true); return; }
  var i = achar(ultimoCod);
  if (i < 0) { msg('nada para desfazer', true); return; }
  itens[i].contado = Math.max(0, itens[i].contado - 1);
  desenhar(); gravarLinha(itens[i]);
  msg('-1 em ' + ultimoCod + ' (total ' + itens[i].contado + ')');
  ultimoCod = ''; ultimoT = 0;
}

// ---------- origem da contagem e codigos que falharam ----------
var ultimaFalhaEm = 0, ultimaFalhaCod = '';

function registrarFalha(bruto, origem, motivo, conexao){
  ultimaFalhaEm = Date.now();
  ultimaFalhaCod = bruto;
  post(API, { acao:'contar', status:'falha', sessao:SESSAO, deposito:dep, codigo:bruto,
    nome:(conexao ? '(o Bling nao respondeu)' : '(codigo nao encontrado no Bling)'),
    contado:0, fisico_no_ato:0, reserva_no_ato:0,
    local:LOCAL, origem:(origem || 'bipagem'),
    observacao:(conexao
      ? ('o Bling nao respondeu depois de 3 tentativas' + (motivo ? ' (' + motivo + ')' : '') + '. O codigo ' + bruto + ' NAO foi conferido: precisa bipar de novo.')
      : ('a etiqueta diz ' + bruto + ' e esse codigo nao existe no Bling' + (motivo ? ' (' + motivo + ')' : ''))) })
  .catch(function(){});
}

// quem decide o tipo do erro e o servidor. So chamamos de "codigo nao existe"
// quando ele diz exatamente isso. Falta de resposta nunca vira codigo inexistente.
function ehFalhaDeConexao(res){
  if (!res) { return true; }
  if (res.tipo) { return res.tipo === 'comunicacao'; }
  var t = String(res.erro || '').toLowerCase();
  return t.indexOf('nao respondeu') >= 0 || t.indexOf('sem resposta') >= 0 || t.indexOf('status ') >= 0;
}

// 3 tentativas antes de desistir: o Bling aceita 3 chamadas por segundo e
// numa contagem rapida ele devolve 429 com frequencia.
function buscarNoBling(cod, cb){
  var n = 0;
  function tenta(){
    n++;
    post(API, { acao:'buscar', codigo:cod, deposito:dep })
     .then(function(res){
       if (res && res.ok) { cb(res, null, false); return; }
       if (ehFalhaDeConexao(res) && n < 3) { msg('o Bling nao respondeu. tentando de novo (' + n + '/2)...', true); setTimeout(tenta, 900 * n); return; }
       cb(null, res, ehFalhaDeConexao(res));
     })
     .catch(function(){
       if (n < 3) { msg('sem resposta do servidor. tentando de novo (' + n + '/2)...', true); setTimeout(tenta, 900 * n); return; }
       cb(null, null, true);
     });
  }
  tenta();
}

// so mexe no pedaco depois do ultimo hifen (o codigo de cor), onde o erro acontece
function variantes(cod){
  var i = String(cod).lastIndexOf('-');
  if (i < 0) { return []; }
  var raiz = cod.slice(0, i + 1);
  var cor = cod.slice(i + 1).toUpperCase();
  var troca = { '0':'O', 'O':'0', '1':'I', 'I':'1', 'L':'1', '5':'S', 'S':'5', '8':'B', 'B':'8' };
  var saida = [];
  for (var k = 0; k < cor.length; k++) {
    var c = cor.charAt(k);
    var alt = troca[c];
    if (!alt) { continue; }
    saida.push(raiz + cor.slice(0, k) + alt + cor.slice(k + 1));
    if (c === '1') { saida.push(raiz + cor.slice(0, k) + 'L' + cor.slice(k + 1)); }
  }
  var vistos = {}, limpo = [];
  for (var j = 0; j < saida.length && limpo.length < 8; j++) {
    var v = saida[j];
    if (v !== cod && !vistos[v]) { vistos[v] = 1; limpo.push(v); }
  }
  return limpo;
}

function procurarSemelhante(bruto, indice, pronto){
  var lista = (indice === 0) ? variantes(bruto.toUpperCase()) : window.__vars;
  if (indice === 0) { window.__vars = lista; }
  if (!lista.length || indice >= lista.length) { pronto(null); return; }
  msg('procurando codigo parecido (' + (indice + 1) + ' de ' + lista.length + ')...');
  post(API, { acao:'buscar', codigo:lista[indice], deposito:dep })
   .then(function(res){
     if (res && res.ok) { res.semelhante = true; res.lido = bruto; pronto(res); return; }
     // se o Bling parou de responder, nao da para concluir que nao existe nada parecido
     if (ehFalhaDeConexao(res)) { pronto(null, true); return; }
     procurarSemelhante(bruto, indice + 1, pronto);
   })
   .catch(function(){ pronto(null, true); });
}

function origemDoProcurar(){
  return (Date.now() - ultimaFalhaEm < 180000) ? 'procurar_apos_falha' : 'procurar_direto';
}

// ---------- som ----------
var audioCtx = null;
function iniciarSom(){
  try {
    if (!audioCtx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) { audioCtx = new AC(); } }
    if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
  } catch(e) {}
}
function bip(freq, ms, vol){
  try {
    if (!audioCtx) { return; }
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = freq || 900;
    g.gain.value = (vol === undefined ? 0.18 : vol);
    o.connect(g); g.connect(audioCtx.destination);
    var t = audioCtx.currentTime;
    o.start(t); o.stop(t + (ms || 110) / 1000);
  } catch(e) {}
}
function somLeu(){ bip(1250, 90); }
function somAdicionou(){ bip(900, 80); setTimeout(function(){ bip(1500, 130); }, 95); }
function somColuna(){ bip(600, 90); setTimeout(function(){ bip(900, 90); }, 100); }
function somErro(){ bip(240, 280, 0.22); }

function confirmarAdicao(){
  if (!pendente) { return; }
  var q = parseInt(el('cfqtd').value, 10);
  if (isNaN(q) || q <= 0) { q = 1; }
  var cod = pendente.codigo;
  var org = (pendente.via || 'bipagem') + (pendente.semelhante ? '_semelhante' : '');
  var nota = pendente.semelhante ? ('etiqueta lida: ' + pendente.lido + ' / cadastro: ' + pendente.codigo) : '';
  somar(pendente, q, org, nota);
  somAdicionou(); vibrar();
  fecharConfirma();
  ultimoCod = cod; ultimoT = Date.now();
  msg('+' + q + ' em ' + cod + ' (aponte para a proxima peca)');
}

function prepararConfirmacao(cod){
  var i = achar(cod);
  if (i >= 0) {
    mostrarConfirma({ codigo: itens[i].codigo, nome: itens[i].nome, idBling: itens[i].idBling, fisico: itens[i].fisico, reserva: itens[i].reserva });
    return;
  }
  msg('procurando ' + cod + ' no Bling...');
  buscarNoBling(cod, function(res, falha, conexao){
     if (!res) {
       somErro();
       if (conexao) {
         registrarFalha(cod, 'bipagem', (falha && falha.erro) || '', true);
         msg('nao consegui falar com o Bling. A peca ' + cod + ' NAO foi contada: bipa de novo daqui a pouco.', true);
         setTimeout(fecharConfirma, 3200);
         return;
       }
       registrarFalha(cod, 'bipagem', (falha && falha.erro) || '', false);
       procurarSemelhante(cod, 0, function(alvo, semResposta){
         if (alvo) { alvo.via = 'bipagem'; mostrarConfirma(alvo); }
         else if (semResposta) { msg('o Bling parou de responder no meio da procura. Bipa de novo daqui a pouco.', true); setTimeout(fecharConfirma, 3200); }
         else { msg('etiqueta ' + cod + ' nao existe no Bling e nao achei nada parecido. Use o botao Procurar.', true); setTimeout(fecharConfirma, 2600); }
       });
       return;
     }
     mostrarConfirma(res);
   });
}

function aceitar(txt){
  txt = String(txt || '').trim();
  if (!txt) return;
  if (pausado) { return; }
  var col = ehColuna(txt);
  if (col) {
    irParaColuna(col); vibrar(); somColuna();
    if (modoColuna) { fecharCam(); }
    return;
  }
  if (modoColuna) { msg('isso nao e etiqueta de coluna. Aponte para o QR da coluna.', true); return; }
  if (precisaLocal() && !LOCAL) { msg('escolha a coluna antes de contar (lista acima ou QR)', true); return; }
  var agora = Date.now();
  if (txt.toUpperCase() === String(ultimoCod).toUpperCase() && (agora - ultimoT) < 2500) { return; }
  pausado = true;
  vibrar(); somLeu();
  prepararConfirmacao(txt);
}

function autoTesteOk(r){
  try {
    var w = new window.ZXingBrowser.BrowserQRCodeSvgWriter();
    var svg = w.write('LR.TESTE', 240, 240);
    var rects = svg.getElementsByTagName('rect');
    if (!rects.length) { return false; }
    var cv = document.createElement('canvas'); cv.width = 240; cv.height = 240;
    var c = cv.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, 240, 240);
    c.fillStyle = '#000';
    for (var i = 0; i < rects.length; i++) {
      var e = rects[i];
      c.fillRect(+e.getAttribute('x'), +e.getAttribute('y'), +e.getAttribute('width'), +e.getAttribute('height'));
    }
    var t = r.decodeFromCanvas(cv);
    var txt = t ? (t.getText ? t.getText() : t.text) : '';
    return txt === 'LR.TESTE';
  } catch(e) { return false; }
}

function novoLeitor(){
  var Z = window.ZXingBrowser;
  if (!Z || typeof Z.BrowserMultiFormatReader !== 'function') { return null; }
  try {
    var r = new Z.BrowserMultiFormatReader();
    if (Z.BarcodeFormat) {
      try {
        r.possibleFormats = [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.QR_CODE];
        if (!autoTesteOk(r)) { r = new Z.BrowserMultiFormatReader(); }
      } catch(e) { r = new Z.BrowserMultiFormatReader(); }
    }
    return r;
  } catch(e) { return null; }
}

function pedirCamera(c){
  try {
    var p = navigator.mediaDevices.getUserMedia(c);
    return (p && p.then) ? p : Promise.reject(new Error('o navegador nao devolveu a camera'));
  } catch(e) { return Promise.reject(e); }
}

function esperarVideo(v){
  return new Promise(function(ok, falha){
    var t0 = Date.now();
    (function ver(){
      if (!scanning) { ok(); return; }
      if (v.videoWidth > 0 && v.videoHeight > 0) { ok(); return; }
      if (Date.now() - t0 > 8000) { falha(new Error('o video nao comecou (tela preta)')); return; }
      setTimeout(ver, 120);
    })();
  });
}

function lacoNativo(det){
  var v = el('vid');
  function passo(){
    if (!scanning) { return; }
    if (pausado) { laco = setTimeout(passo, 250); return; }
    try {
      det.detect(v).then(function(r){ if (r && r.length && scanning && !pausado) { aceitar(r[0].rawValue); } }).catch(function(){});
    } catch(e) {}
    laco = setTimeout(passo, 120);
  }
  passo();
}

function lacoLeitura(){
  if ('BarcodeDetector' in window) {
    Promise.resolve()
     .then(function(){ return window.BarcodeDetector.getSupportedFormats ? window.BarcodeDetector.getSupportedFormats() : null; })
     .then(function(sup){
       var quero = ['qr_code', 'code_128'], lista = [];
       if (sup && sup.length) { for (var i = 0; i < quero.length; i++) { if (sup.indexOf(quero[i]) >= 0) { lista.push(quero[i]); } } }
       var det = null;
       try { det = lista.length ? new window.BarcodeDetector({ formats: lista }) : null; } catch(e) { det = null; }
       if (det) { lacoNativo(det); } else { lacoZXing(); }
     })
     .catch(function(){ lacoZXing(); });
    return;
  }
  lacoZXing();
}

function lacoZXing(){
  var v = el('vid');
  var cv = document.createElement('canvas');
  var ctx = null;
  try { ctx = cv.getContext('2d'); } catch(e) { ctx = null; }
  var leitor = novoLeitor();
  if (!ctx || !leitor) { falharCam('nao consegui preparar o leitor neste navegador.'); return; }
  function passo(){
    if (!scanning) { return; }
    if (pausado) { laco = setTimeout(passo, 250); return; }
    try {
      var w = v.videoWidth, h = v.videoHeight;
      if (w && h) {
        var x = Math.round(w * 0.04), y = Math.round(h * 0.30);
        var lw = Math.round(w * 0.92), lh = Math.round(h * 0.40);
        var k = Math.min(1, 700 / lw);
        cv.width = Math.max(1, Math.round(lw * k));
        cv.height = Math.max(1, Math.round(lh * k));
        ctx.drawImage(v, x, y, lw, lh, 0, 0, cv.width, cv.height);
        try {
          var res = leitor.decodeFromCanvas(cv);
          if (res) { aceitar(res.getText ? res.getText() : res.text); }
        } catch(e2) { /* nao achou nada neste quadro: normal */ }
      }
    } catch(e) { /* quadro ruim: tenta o proximo */ }
    laco = setTimeout(passo, 120);
  }
  passo();
}

var TENTATIVAS = [
  ['camera de tras', { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }],
  ['camera de tras (simples)', { video: { facingMode: 'environment' } }],
  ['camera padrao', { video: true, audio: false }],
  ['camera minima', { video: {} }]
];

function tentarCameras(i){
  if (i >= TENTATIVAS.length) { return Promise.reject(new Error('nenhum modo de camera funcionou neste aparelho')); }
  camPasso('1 de 3: tentando ' + TENTATIVAS[i][0] + '...');
  return pedirCamera(TENTATIVAS[i][1]).catch(function(e){
    if (i === TENTATIVAS.length - 1) { throw e; }
    return tentarCameras(i + 1);
  });
}

function probaCamera(){
  var p = el('painel');
  p.style.display = 'block';
  p.innerHTML = '<h3>Teste da camera</h3><div class=obs id=probatxt style="line-height:1.6;word-break:break-all">testando...</div>';
  var linhas = [];
  function add(t){ linhas.push(t); var e = el('probatxt'); if (e) { e.innerHTML = linhas.map(esc).join('<br>'); } }
  linhas = [];
  add('endereco seguro: ' + (window.isSecureContext ? 'sim' : 'NAO'));
  add('pagina no topo: ' + ((window.top === window.self) ? 'sim' : 'NAO, esta dentro de uma moldura'));
  var md = navigator.mediaDevices;
  add('mediaDevices: ' + (md ? 'existe' : 'NAO existe'));
  if (md) {
    add('getUserMedia: ' + (typeof md.getUserMedia));
    var src = '';
    try { src = String(md.getUserMedia).replace(/\s+/g, ' ').slice(0, 70); } catch(e) { src = 'nao consegui ler'; }
    add('funcao: ' + src);
  }
  add('webkitGetUserMedia antigo: ' + (typeof navigator.webkitGetUserMedia));
  var i = 0;
  function proxima(){
    if (i >= TENTATIVAS.length) { add('--- fim do teste ---'); return; }
    var nome = TENTATIVAS[i][0], c = TENTATIVAS[i][1];
    i++;
    var pr = null;
    try { pr = navigator.mediaDevices.getUserMedia(c); }
    catch(e) { add(nome + ': FALHOU na hora -- ' + porque(e)); proxima(); return; }
    if (!pr || !pr.then) { add(nome + ': nao devolveu promessa'); proxima(); return; }
    pr.then(function(st){
      var n = 0;
      try { n = st.getVideoTracks().length; } catch(e) {}
      add(nome + ': FUNCIONOU (' + n + ' camera)');
      try { var t = st.getTracks(); for (var k=0;k<t.length;k++){ t[k].stop(); } } catch(e) {}
      proxima();
    }).catch(function(e){ add(nome + ': ' + porque(e)); proxima(); });
  }
  if (md && md.enumerateDevices) {
    md.enumerateDevices()
     .then(function(ds){
       var v = 0;
       for (var k = 0; k < ds.length; k++) { if (ds[k].kind === 'videoinput') { v++; } }
       add('cameras vistas: ' + v + ' (de ' + ds.length + ' dispositivos)');
     })
     .catch(function(e){ add('enumerateDevices: ' + porque(e)); })
     .then(proxima, proxima);
  } else {
    proxima();
  }
}

function abrirCam(soColuna){
  modoColuna = !!soColuna;
  if (!modoColuna && precisaLocal() && !LOCAL) { msg('escolha a coluna antes de contar (lista acima ou QR)', true); return; }
  if (!window.ZXingBrowser || typeof window.ZXingBrowser.BrowserMultiFormatReader !== 'function') {
    falharCam('o leitor de codigo nao carregou. Confira a internet e recarregue a pagina.');
    return;
  }
  el('cam').style.display = 'flex';
  el('camcol').textContent = LOCAL || '';
  el('camtitulo').textContent = modoColuna ? 'LENDO A ETIQUETA DA COLUNA' : 'CONTANDO PECAS';
  el('btdesfaz').style.display = modoColuna ? 'none' : '';
  scanning = true;
  iniciarSom();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    falharCam('este navegador nao libera a camera ao vivo. Use o botao de tirar foto.');
    return;
  }
  var v = el('vid');
  try {
    v.setAttribute('playsinline', 'true');
    v.setAttribute('webkit-playsinline', 'true');
    v.setAttribute('muted', 'true');
    v.muted = true;
  } catch(e) {}
  camPasso('1 de 3: pedindo acesso a camera...');
  tentarCameras(0)
   .then(function(s){
     if (!s) { throw new Error('a camera nao respondeu'); }
     if (!scanning) { try { var t = s.getTracks(); for (var i=0;i<t.length;i++){ t[i].stop(); } } catch(e){} return null; }
     stream = s;
     camPasso('2 de 3: ligando o video...');
     try { v.srcObject = s; } catch(e) { throw new Error('nao consegui ligar o video: ' + porque(e)); }
     var p = null;
     try { p = v.play(); } catch(e) { p = null; }
     return (p && p.then) ? p.catch(function(){ return null; }) : null;
   })
   .then(function(){ if (!scanning) { return null; } camPasso('3 de 3: preparando a leitura...'); return esperarVideo(v); })
   .then(function(){
     if (!scanning) { return; }
     camPasso(modoColuna ? 'aponte para o QR da coluna' : 'aponte para o codigo de barras da peca');
     lacoLeitura();
   })
   .catch(function(e){ falharCam('parou em "' + etapa + '" -- ' + porque(e)); });
}

function lerFoto(arq){
  if (!arq) { return; }
  var leitor = novoLeitor();
  if (!leitor) { msg('o leitor nao carregou; recarregue a pagina', true); return; }
  var url = URL.createObjectURL(arq);
  msg('lendo a foto...');
  leitor.decodeFromImageUrl(url)
   .then(function(res){
     try { URL.revokeObjectURL(url); } catch(e){}
     ultimoCod = ''; ultimoT = 0;
     aceitar(res.getText ? res.getText() : res.text);
   })
   .catch(function(){
     try { URL.revokeObjectURL(url); } catch(e){}
     msg('nao achei codigo nessa foto. Chegue mais perto, enquadre so o codigo e tente de novo.', true);
   });
}

function pararStream(){
  try { if (stream) { var t = stream.getTracks(); for (var i=0;i<t.length;i++){ t[i].stop(); } stream = null; } } catch(e){}
  try { el('vid').srcObject = null; } catch(e){}
}

function fecharCam(){
  scanning = false;
  modoColuna = false;
  pausado = false;
  pendente = null;
  el('confirma').style.display = 'none';
  if (laco) { clearTimeout(laco); laco = 0; }
  pararStream();
  el('cam').style.display = 'none';
}

// ---------- sessao ----------
function restaurar(){
  post(API, { acao:'resumo', sessao:SESSAO })
   .then(function(res){
     if (res && res.ok && res.linhas) {
       itens = res.linhas.map(function(l){
         var ls = String(l.local || '').split(',');
         var lim = [];
         for (var i=0;i<ls.length;i++){ var x = String(ls[i]).trim(); if (x) { lim.push(x); } }
         return { codigo:l.codigo, nome:l.nome, idBling:l.idBling, deposito:String(l.deposito), contado:Number(l.contado), fisico:Number(l.fisico_no_ato), reserva:Number(l.reserva_no_ato), locais:lim, origem:String(l.origem || 'bipagem'), nota:String(l.observacao || '') };
       });
       desenhar(); desenharColunas();
       msg('sessao ' + SESSAO + ' carregada');
     } else { desenhar(); desenharColunas(); msg((res && res.erro) || ('sessao ' + SESSAO), !(res && res.ok)); }
   })
   .catch(function(){ desenhar(); desenharColunas(); msg('nao consegui carregar a sessao do servidor', true); });
}

function procurar(){
  var t = el('ptexto').value.trim();
  if (!t) return;
  var r = el('presult');
  r.innerHTML = '<div class=obs>procurando...</div>';
  post(API, { acao:'procurar', texto:t, deposito:dep })
   .then(function(res){
     if (!res || !res.ok) { r.innerHTML = '<div class=obs style=color:#f77>' + esc((res && res.erro) || 'nao consegui procurar') + '</div>'; return; }
     achados = res.linhas || [];
     if (!achados.length) { r.innerHTML = '<div class=obs>' + esc(res.aviso || 'nada encontrado') + '</div>'; return; }
     var h = '<div class=obs>' + achados.length + ' de ' + res.total + ' variacoes' + (res.bateu_o_teto ? ' (teto de 100 atingido, refine o nome)' : '') + '</div>';
     for (var i=0;i<achados.length;i++){
       var a = achados[i];
       h += '<div class=pr><div class=l1>' + esc(a.codigo) + '</div><div class=l2>' + esc(a.nome) + '</div>';
       h += '<div class=l3><span class=tag>Bling <b>' + num(a.fisico) + '</b></span><span class=tag>reserva <b>' + num(a.reserva) + '</b></span>';
       h += '<input type=number inputmode=numeric placeholder=qtd data-pq=' + i + '>';
       h += '<button class=bp data-padd=' + i + '>Somar</button></div></div>';
     }
     r.innerHTML = h;
   })
   .catch(function(){ r.innerHTML = '<div class=obs style=color:#f77>sem resposta do servidor</div>'; });
}

function classeStatus(st){
  if (st === 'gravado') return 'ok';
  if (st === 'recusado' || st === 'gravado sem conferir') return 'no';
  if (st === 'simulado') return 'sim';
  return 'eq';
}

function mostrarPainel(res, eraSimulacao, faltam){
  var p = el('painel');
  p.style.display = 'block';
  var h = '<h3>' + (eraSimulacao ? 'Conferencia (nada foi gravado)' : 'Resultado da gravacao') + '</h3>';
  var st = res.por_status || {};
  var partes = [];
  for (var k in st) { partes.push(st[k] + ' ' + k); }
  h += '<div class=obs style=margin-bottom:8px>' + esc(partes.join(' - ')) + '</div>';
  for (var i=0;i<res.linhas.length;i++){
    var l = res.linhas[i];
    h += '<div class=pl><span class=' + classeStatus(l.status) + '>' + esc(String(l.status).toUpperCase()) + '</span> ' + esc(l.codigo) + ' - contado ' + l.contado;
    if (l.local) { h += ' <span class=loc>' + esc(l.local) + '</span>'; }
    if (l.observacao) { h += '<div class=obs>' + esc(l.observacao) + '</div>'; }
    h += '</div>';
  }
  if (eraSimulacao) {
    h += '<div style=margin-top:12px><div class=obs style=margin-bottom:6px>para gravar de verdade, digite o PIN</div><div class=linha><input id=pin type=password inputmode=numeric placeholder=PIN autocomplete=off><button class=bp id=btgravar>Gravar no Bling</button></div></div>';
  } else if (faltam > 0) {
    h += '<div style=margin-top:12px><div class=linha><input id=pin type=password inputmode=numeric placeholder=PIN autocomplete=off><button class=bp id=btmais>Continuar: faltam ' + faltam + '</button></div></div>';
  }
  p.innerHTML = h;
  var bg = el('btgravar');
  if (bg) { bg.addEventListener('click', function(){ rodar(false, el('pin').value); }); }
  var bmx = el('btmais');
  if (bmx) { bmx.addEventListener('click', function(){ rodar(false, el('pin').value); }); }
  window.scrollTo(0,0);
}

function puxarResumo(eraSimulacao, faltam){
  post(API, { acao:'resumo', sessao:SESSAO })
   .then(function(res){ el('btsync').disabled = false; if (res && res.ok) { mostrarPainel(res, eraSimulacao, faltam); msg(''); } else { msg('nao consegui ler o resumo', true); } })
   .catch(function(){ el('btsync').disabled = false; msg('nao consegui ler o resumo', true); });
}

function rodar(simular, pin){
  var b = el('btsync'); b.disabled = true;
  msg(simular ? 'conferindo...' : 'gravando no Bling, nao feche a tela...');
  post(GRAVAR, { sessao:SESSAO, simular: simular ? 'true' : 'false', pin: pin || '' })
   .then(function(res){
     if (!res || !res.ok) { msg('nao consegui iniciar', true); b.disabled=false; return; }
     if (!res.iniciado) { msg(res.motivo || 'nada a fazer', true); b.disabled=false; return; }
     var espera = 3000 + res.neste_lote * (simular ? 1200 : 3000);
     msg((simular ? 'conferindo ' : 'gravando ') + res.neste_lote + ' codigo(s), aguarde...');
     setTimeout(function(){ puxarResumo(simular, res.faltam_depois); }, espera);
   })
   .catch(function(){ msg('sem resposta do servidor', true); b.disabled=false; });
}

el('codigo').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); bipar(this.value); this.value=''; this.focus(); } });
el('qtd').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); var c=el('codigo'); bipar(c.value); c.value=''; c.focus(); } });
el('btadd').addEventListener('click', function(){ var c = el('codigo'); bipar(c.value); c.value=''; c.focus(); });
el('btproc').addEventListener('click', abrirProcura);
el('btsync').addEventListener('click', function(){ rodar(true, ''); });
el('btcam').addEventListener('click', function(){ abrirCam(false); });
el('btcolqr').addEventListener('click', function(){ abrirCam(true); });
el('btcamx').addEventListener('click', fecharCam);
el('btdesfaz').addEventListener('click', desfazer);
el('btdiag').addEventListener('click', function(){ mostrarErroCam('Diagnostico da camera neste aparelho:'); });
el('btfoto').addEventListener('click', function(){ el('fotoin').click(); });
el('btfotoger').addEventListener('click', function(){ modoColuna = false; iniciarSom(); el('fotoin').click(); });
el('btproba').addEventListener('click', probaCamera);
el('cfadd').addEventListener('click', confirmarAdicao);
el('cfcancel').addEventListener('click', function(){ fecharConfirma(); msg('leitura descartada'); });
el('cfmenos').addEventListener('click', function(){ var q = parseInt(el('cfqtd').value,10) || 1; el('cfqtd').value = Math.max(1, q - 1); });
el('cfmais').addEventListener('click', function(){ var q = parseInt(el('cfqtd').value,10) || 0; el('cfqtd').value = q + 1; });
el('cfqtd').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); confirmarAdicao(); } });
el('fotoin').addEventListener('change', function(){ var f = this.files && this.files[0]; this.value = ''; lerFoto(f); });
el('colsel').addEventListener('change', function(){ irParaColuna(this.value); });
el('colchips').addEventListener('click', function(e){ if (e.target && e.target.dataset && e.target.dataset.col) { irParaColuna(e.target.dataset.col); } });
el('deposito').value = dep;
el('deposito').addEventListener('change', function(){ dep = this.value; if (!precisaLocal()) { LOCAL = ''; } desenhar(); desenharColunas(); msg('mostrando so o deposito escolhido'); });

el('lista').addEventListener('click', function(e){
  var t = e.target;
  if (!t.dataset) return;
  if (t.dataset.tira !== undefined) {
    if (t.dataset.confirma === '1') { removerLinha(+t.dataset.tira); }
    else { t.dataset.confirma = '1'; t.textContent = 'confirmar?'; }
    return;
  }
  if (t.dataset.mais !== undefined) { var a=+t.dataset.mais; itens[a].contado+=1; marcarLocal(itens[a]); desenhar(); desenharColunas(); gravarLinha(itens[a]); }
  if (t.dataset.menos !== undefined) { var b=+t.dataset.menos; itens[b].contado=Math.max(0,itens[b].contado-1); desenhar(); gravarLinha(itens[b]); }
});
el('lista').addEventListener('change', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.qtd !== undefined) { var i=+t.dataset.qtd; itens[i].contado=Math.max(0, parseInt(t.value,10)||0); desenhar(); gravarLinha(itens[i]); }
});
el('procura').addEventListener('click', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.padd !== undefined) {
    var i = +t.dataset.padd;
    var campo = el('procura').querySelector('[data-pq=\u0022' + i + '\u0022]');
    var q = parseInt(campo && campo.value, 10);
    if (isNaN(q) || q <= 0) { q = 1; }
    var a = achados[i];
    if (a.fisico === null) { msg('nao li o saldo dessa variacao, nao vou contar as cegas', true); return; }
    if (precisaLocal() && !LOCAL) { msg('escolha a coluna antes de contar (lista acima ou QR)', true); return; }
    var org = origemDoProcurar();
    somar(a, q, org, (org === 'procurar_apos_falha' && ultimaFalhaCod) ? ('entrou pelo Procurar depois da etiqueta ' + ultimaFalhaCod + ' falhar') : 'entrou pelo Procurar sem tentativa de leitura');
    if (campo) { campo.value = ''; }
    msg('somei ' + q + ' em ' + a.codigo + ' (' + (org === 'procurar_apos_falha' ? 'etiqueta divergente' : 'sem etiqueta') + ')');
  }
});

el('btexport').addEventListener('click', function(){
  var linhas = ['codigo;nome;deposito;local;contado;bling;reserva;origem;observacao'];
  for (var i=0;i<itens.length;i++){ var it=itens[i]; linhas.push([it.codigo,String(it.nome||'').replace(/;/g,','),it.deposito,(it.locais||[]).join(' '),it.contado,it.fisico,it.reserva,(it.origem||'bipagem'),String(it.nota||'').replace(/;/g,',')].join(';')); }
  var p = el('painel');
  p.style.display='block';
  p.innerHTML = '<h3>CSV da sessao ' + esc(SESSAO) + '</h3><div class=obs style=margin-bottom:6px>selecione tudo e copie</div><textarea rows=12>' + esc(linhas.join('\n')) + '</textarea>';
  window.scrollTo(0,0);
});

montarSelect();
desenharColunas();
if (!CHAVE) {
  msg('abra pelo link completo, com a chave no fim do endereco', true);
} else {
  restaurar();
}
el('codigo').focus();
})();
</script></body></html>
